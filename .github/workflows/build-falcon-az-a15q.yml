name: Build Falcon-AZ CPH2185 CPH2179 Built-in WiFi BT KSU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout packaging repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            gcc-aarch64-linux-gnu \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            zip

      - name: Download CPH2185 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth=1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src
          git -C src submodule update --init --recursive
          git -C src fetch --unshallow
          test -f src/arch/arm64/configs/CPH2185_defconfig
          test -d src/KernelSU/kernel
          test -f src/.gitmodules
          grep -q 'github.com/leonardrua/BakaSU' src/.gitmodules

      - name: Verify KernelSU BakaSU and SUSFS
        working-directory: src
        run: |
          test -d KernelSU/kernel
          test -f .gitmodules
          grep -q 'github.com/leonardrua/BakaSU' .gitmodules
          test "$(git -C KernelSU rev-parse HEAD)" = "$(git ls-tree HEAD KernelSU | awk '{print $3}')"
          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q '^CONFIG_KSU=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_KSU_SUSFS=y' arch/arm64/configs/CPH2185_defconfig

      - name: Verify source configuration
        working-directory: src
        run: |
          grep -q '^CONFIG_LOCALVERSION=""' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_LOCALVERSION_AUTO=n' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_KALLSYMS_ALL=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_KSU=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_KSU_SUSFS=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MODVERSIONS=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MODULE_FORCE_LOAD=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MODULE_FORCE_UNLOAD=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MTK_COMBO=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MTK_COMBO_WIFI=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MTK_COMBO_BT=y' arch/arm64/configs/CPH2185_defconfig
          grep -q '^CONFIG_MTK_COMBO_CHIP_CONSYS_6765=y' arch/arm64/configs/CPH2185_defconfig
          ! grep -q '^CONFIG_MTK_WIFI_ONLY=y' arch/arm64/configs/CPH2185_defconfig
          ! grep -q '^CONFIG_WLAN_DRV_BUILD_IN=' arch/arm64/configs/CPH2185_defconfig
          grep -q 'novatek,swrst-n8-addr' arch/arm64/boot/dts/mediatek/oppo6765.dts
          grep -q '^export CLANG_FLAGS' Makefile
          ! grep -qE '^[[:space:]]*flags \|= MODULE_INIT_IGNORE_(MODVERSIONS|VERMAGIC);' kernel/module.c
          grep -q '4.9.190-falcon-az' init/version.c

      - name: Package working source
        working-directory: src
        run: |
          set -eu
          tar --exclude='./out' --exclude='./.git' --exclude='./KernelSU/.git' \
            -czf "../Falcon-AZ-source-${GITHUB_SHA::12}.tar.gz" .
          ls -lh "../Falcon-AZ-source-${GITHUB_SHA::12}.tar.gz"
          sha256sum "../Falcon-AZ-source-${GITHUB_SHA::12}.tar.gz"

      - name: Push working source to falcon-az-source
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "Azizur Rahman"
          git config user.email "iremm12rr@gmail.com"
          git config http.postBuffer 524288000
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Falcon-AZ 4.9.190 working source: built-in WiFi and Bluetooth, KernelSU SUSFS, touch fix"
          fi
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/falcon-az-source

      - name: Build kernel and DTBs
        working-directory: src
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          ODM_WT_EDIT: "yes"
          VENDOR_EDIT: "1"
        run: |
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CPH2185_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            AUTOCONF_H="$PWD/out/include/generated/autoconf.h" \
            Image.gz-dtb dtbs
          test -s out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          cp out/.config ../Falcon-AZ-config
          cp out/System.map ../Falcon-AZ-System.map
          grep -E '^CONFIG_LOCALVERSION|^CONFIG_KSU|^CONFIG_KSU_SUSFS|^CONFIG_MODULE_FORCE|^CONFIG_MODVERSIONS|^CONFIG_MTK_COMBO|^CONFIG_MTK_WIFI' ../Falcon-AZ-config | head -40

      - name: Verify built-in WiFi kernel
        working-directory: src
        run: |
          set -ex
          echo '== config checks =='
          grep -q '^CONFIG_LOCALVERSION=""' ../Falcon-AZ-config
          grep -qE '^(CONFIG_LOCALVERSION_AUTO=n|# CONFIG_LOCALVERSION_AUTO is not set)$' ../Falcon-AZ-config
          grep -q '^CONFIG_KSU=y' ../Falcon-AZ-config
          grep -q '^CONFIG_KSU_SUSFS=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MODVERSIONS=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MODULE_FORCE_LOAD=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MODULE_FORCE_UNLOAD=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MTK_COMBO=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MTK_COMBO_WIFI=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MTK_COMBO_BT=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MTK_COMBO_CHIP_CONSYS_6765=y' ../Falcon-AZ-config
          grep -q '^CONFIG_MTK_CONNSYS_DEDICATED_LOG_PATH=y' ../Falcon-AZ-config

          echo '== kernel release checks =='
          test "$(cat out/include/config/kernel.release)" = "4.9.190+"
          grep -q '#define UTS_RELEASE "4.9.190+"' out/include/generated/utsrelease.h

          echo '== built files =='
          ls -lh out/vmlinux out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz-dtb

          echo '== display and vermagic checks =='
          grep -aob '4.9.190-falcon-az' out/vmlinux | head -3
          grep -aob '4.9.190-falcon-az' out/arch/arm64/boot/Image | head -3
          grep -aob '4.9.190+ SMP preempt mod_unload modversions aarch64' out/kernel/module.o | head -3
          grep -aob '4.9.190+ SMP preempt mod_unload modversions aarch64' out/vmlinux | head -3

          echo '== built-in WiFi object checks =='
          test -s out/drivers/misc/mediatek/connectivity/common/wmt_drv.o
          test -s out/drivers/misc/mediatek/connectivity/wlan/adaptor/wmt_chrdev_wifi.o
          test -s out/drivers/misc/mediatek/connectivity/wlan/core/gen4m/wlan_6765_axi.o
          test -s out/drivers/misc/mediatek/connectivity/common/built-in.o
          test -s out/drivers/misc/mediatek/connectivity/wlan/adaptor/built-in.o
          test -s out/drivers/misc/mediatek/connectivity/wlan/core/gen4m/built-in.o

          echo '== built-in Bluetooth object checks =='
          test -s out/drivers/misc/mediatek/connectivity/bt/mt66xx/legacy/stp_chrdev_bt.o
          test -s out/drivers/misc/mediatek/connectivity/bt/mt66xx/legacy/fw_log_bt.o
          test -s out/drivers/misc/mediatek/connectivity/bt/mt66xx/legacy/bt_drv.o
          test -s out/drivers/misc/mediatek/connectivity/bt/mt66xx/legacy/built-in.o

          echo '== built-in WiFi symbol checks =='
          grep -q ' wmt_export_platform_bridge_register$' ../Falcon-AZ-System.map
          grep -q ' mtk_wcn_wmt_wifi_init$' ../Falcon-AZ-System.map
          grep -q ' mtk_wcn_wlan_gen4_init$' ../Falcon-AZ-System.map
          grep -q ' glRegisterBus$' ../Falcon-AZ-System.map
          grep -q ' wmt_detect_driver_init$' ../Falcon-AZ-System.map
          grep -q ' mtk_wcn_common_drv_init$' ../Falcon-AZ-System.map

          echo '== built-in Bluetooth symbol checks =='
          grep -q ' T mtk_wcn_stpbt_drv_init$' ../Falcon-AZ-System.map
          grep -q ' T fw_log_bt_init$' ../Falcon-AZ-System.map

          echo '== no connectivity module files =='
          test -z "$(find out/drivers/misc/mediatek/connectivity -name '*.ko' -print -quit)"

          echo '== built-in WiFi and Bluetooth verification passed =='

      - name: Package AnyKernel
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cp src/out/arch/arm64/boot/Image.gz-dtb anykernel/Image.gz-dtb
          cp packaging/cph2185-anykernel.sh anykernel/anykernel.sh
          sed -i 's/^kernel.string=.*/kernel.string=Falcon-AZ Kernel by Azizur Rahman/' anykernel/anykernel.sh
          chmod +x anykernel/anykernel.sh
          grep -q '^do.devicecheck=0' anykernel/anykernel.sh
          ! grep -q 'wifi_modules' anykernel/anykernel.sh
          ! grep -q 'install_wifi_modules' anykernel/anykernel.sh
          grep -nE 'kernel.string|do.devicecheck' anykernel/anykernel.sh
          rm -rf anykernel/.git
          cd anykernel
          zip -r9 "../Falcon-AZ-CPH2185-CPH2179-${GITHUB_SHA::12}.zip" . \
            -x README.md -x '*placeholder' -x '.git/*'
          cd ..
          sha256sum Falcon-AZ-CPH2185-CPH2179-*.zip

      - name: Upload Falcon-AZ kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-AZ-CPH2185-CPH2179-${{ github.sha }}
          path: |
            Falcon-AZ-CPH2185-CPH2179-*.zip
            Falcon-AZ-config
            Falcon-AZ-System.map
          if-no-files-found: error
          retention-days: 14

      - name: Upload working source
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-AZ-source-${{ github.sha }}
          path: Falcon-AZ-source-*.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug kernel files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-AZ-debug-${{ github.sha }}
          path: |
            src/out/vmlinux
            src/out/arch/arm64/boot/Image
            src/out/arch/arm64/boot/Image.gz-dtb
            src/out/kernel/module.o
            src/out/Module.symvers
            src/out/include/config/kernel.release
            src/out/include/generated/utsrelease.h
            Falcon-AZ-config
            Falcon-AZ-System.map
          if-no-files-found: warn
          retention-days: 3
